  <rect x="15" y="9" width="2" height="2" fill="#1a1f24"/>
  <rect x="9" y="15" width="2" height="2" fill="#1a1f24" opacity=".55"/>
  <rect x="21" y="15" width="2" height="2" fill="#1a1f24" opacity=".55"/>
  <rect x="15" y="21" width="2" height="2" fill="#1a1f24" opacity=".55"/>
</svg>
